site_name: Prompts Library
site_description: Biblioteca Premium de Prompts para IA
site_author: Caique Contarini
site_url: https://caiquecontarini.github.io/prompts-library/
repo_url: https://github.com/caiquecontarini/prompts-library
repo_name: caiquecontarini/prompts-library

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-7
        name: Light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/brightness-4
        name: Dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:pymdownx.emoji.twemoji
      emoji_generator: !!python/name:pymdownx.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Técnicas: tecnicas.md
  - Frameworks: frameworks.md
  - Casos de Uso: casos-uso.md
  - Recursos: recursos.md
  - Contribuir: CONTRIBUIR.md
  - GitHub: https://github.com/caiquecontarini/prompts-library
